# Local PostgreSQL 18 Database Connection ('postgres' database)
spring.datasource.url=orders24db.c1keq0am45kn.ap-southeast-2.rds.amazonaws.com
spring.datasource.username=orders24
spring.datasource.password=Xbea100%
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port Configuration
server.port=${PORT:5432}

# File Upload Limits for Gallery Module (Allows multiple image uploads up to 5MB each)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Serve Uploaded Gallery Images from Local Disk ('uploads/' folder)
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:uploads/
